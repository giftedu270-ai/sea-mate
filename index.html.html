<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea-mate</title>
<style>
:root{
  --bg:#eef8fb;--card:#fff;--text:#123443;--muted:#708792;--line:#d9e8ee;
  --primary:#087ca7;--primary2:#045f80;--green:#16a36a;--danger:#c43d52;
  --yellow:#f3b61f;--shadow:0 14px 38px rgba(20,72,93,.10);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f7fcfe,#eaf6fa);color:var(--text);min-height:100vh}
.wrap{width:min(760px,calc(100% - 24px));margin:auto;padding:22px 0 98px}
.brand{text-align:center;margin:5px 0 20px}
.brand h1{margin:0;color:var(--primary);letter-spacing:.08em;font-size:38px}
.brand p{margin:6px 0;color:var(--muted)}
.card{background:var(--card);border:1px solid rgba(8,124,167,.09);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef5f8;padding:5px;border-radius:13px;margin-bottom:18px}
.tab{border:0;background:transparent;padding:11px;border-radius:9px;font-weight:800;color:var(--muted);cursor:pointer}
.tab.active{background:#fff;color:var(--primary)}
.panel{display:none}.panel.active{display:block}.grid{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:14px;font-weight:750}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;color:var(--text);background:#fbfdfe;outline:none}
textarea{min-height:105px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,124,167,.09)}
.btn{border:0;border-radius:12px;padding:12px 15px;font:inherit;font-weight:850;cursor:pointer}
.btn.primary{background:var(--primary);color:white}.btn.secondary{background:#e8f5f9;color:var(--primary2)}.btn.danger{background:#fff0f3;color:var(--danger)}.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{min-height:21px;margin-top:10px;font-size:13px;color:var(--muted)}.msg.error{color:var(--danger)}.msg.ok{color:var(--green)}
.app{display:none}.page{display:none}.page.active{display:block}
.profile-head{display:flex;gap:12px;align-items:center}.avatar{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:#e3f4f9;font-size:25px;flex:none}
.profile-head h2{margin:0;font-size:21px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.badge{display:inline-block;margin-top:7px;border-radius:999px;padding:5px 9px;background:#edf7fb;color:var(--primary2);font-size:12px;font-weight:850}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:13px}.section-head h2{margin:0;font-size:20px}.count{color:var(--primary);font-weight:900}
.people{display:grid;gap:10px}.person{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fcfeff;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(22,163,106,.12)}
.person strong{display:block}.person small{color:var(--muted)}.tag{font-size:11px;font-weight:850;background:#eaf7fb;color:var(--primary2);border-radius:999px;padding:6px 8px}
.empty{text-align:center;color:var(--muted);padding:23px;border:1px dashed var(--line);border-radius:13px}
.comment-box{margin-top:13px;padding:14px;background:#f6fafc;border-radius:13px;white-space:pre-wrap;line-height:1.55;color:#36515e}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr 1fr;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:20}
.navbtn{border:0;background:transparent;padding:9px;font:inherit;font-weight:800;color:var(--muted);cursor:pointer}.navbtn.active{color:var(--primary)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,36,48,.47);z-index:30;padding:20px;align-items:center;justify-content:center}.modal-bg.show{display:flex}
.modal{width:min(460px,100%);background:#fff;border-radius:21px;padding:21px;box-shadow:0 24px 60px rgba(0,0,0,.22);max-height:90vh;overflow:auto}
.modal-top{display:flex;justify-content:space-between;gap:10px}.close{border:0;background:#edf4f7;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
.info-list{display:grid;gap:9px;margin:17px 0}.info-row{display:flex;justify-content:space-between;gap:20px;padding-bottom:9px;border-bottom:1px solid #edf2f4}.info-row span:first-child{color:var(--muted)}
.smallnote{font-size:12px;color:var(--muted);line-height:1.55}
.rating{display:flex;align-items:center;gap:5px}.stars{color:var(--yellow);letter-spacing:1px;font-size:18px}.rating-note{font-size:12px;color:var(--muted)}
.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.weather-main{display:flex;align-items:center;gap:14px;margin-bottom:16px}.weather-icon{font-size:42px}.weather-temp{font-size:34px;font-weight:900}.weather-desc{font-weight:800}.weather-item{background:#f6fafc;border-radius:12px;padding:11px;text-align:center}.weather-item b{display:block;margin-top:3px}.weather-item span{font-size:11px;color:var(--muted)}
.dm-layout{display:grid;grid-template-columns:240px 1fr;gap:14px}.chat-list{display:grid;gap:8px;align-content:start}.chat-item{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;cursor:pointer;text-align:left}.chat-item.active{border-color:var(--primary);background:#f0f9fc}.chat-item strong{display:block}.chat-item small{color:var(--muted)}
.chat-box{display:flex;flex-direction:column;min-height:520px}.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.chat-messages{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:14px 2px;max-height:420px;min-height:300px}
.bubble{max-width:78%;padding:10px 12px;border-radius:14px;line-height:1.45;word-break:break-word}.bubble.mine{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}.bubble.theirs{align-self:flex-start;background:#eef4f7;border-bottom-left-radius:4px}.bubble-time{display:block;font-size:10px;opacity:.75;margin-top:4px}
.chat-form{display:grid;grid-template-columns:1fr auto;gap:8px}.chat-form input{margin:0}
.meeting-actions{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.review-stars{display:flex;gap:8px;justify-content:center;margin:16px 0}.star-btn{border:0;background:transparent;font-size:34px;color:#cfd8dc;cursor:pointer}.star-btn.active{color:var(--yellow)}
.review-list{display:grid;gap:9px;margin-top:12px}.review-card{background:#f8fbfc;border-radius:12px;padding:11px}.review-card small{color:var(--muted)}
@media(max-width:650px){
  .card{padding:17px}.wrap{width:calc(100% - 18px)}.person{grid-template-columns:auto 1fr}.person .tag{grid-column:2;justify-self:start}
  .weather-grid{grid-template-columns:1fr 1fr}.dm-layout{grid-template-columns:1fr}.chat-list{grid-template-columns:repeat(2,1fr)}.chat-box{min-height:470px}
}
</style>
</head>
<body>
<main class="wrap">
<header class="brand"><h1>SEA-MATE</h1><p>부산 바다에서 함께할 사람을 만나보세요</p></header>

<section id="authCard" class="card">
  <div class="tabs">
    <button id="signupTab" class="tab active">회원가입</button>
    <button id="loginTab" class="tab">로그인</button>
  </div>

  <div id="signupPanel" class="panel active">
    <form id="signupForm" class="grid">
      <label>회원 분류
        <select id="signupMemberType" required>
          <option value="">선택하세요</option><option value="취미">취미</option><option value="수강생">수강생</option><option value="강사">강사</option>
        </select>
      </label>
      <label>이름<input id="signupName" maxlength="20" required placeholder="예: 민수"></label>
      <label>취미
        <select id="signupHobby" required>
          <option value="">선택하세요</option><option>서핑</option><option>낚시</option><option>수영</option><option>스노클링</option><option>패들보드</option><option>사진 촬영</option><option>해변 산책</option><option>러닝</option><option>해양 환경 활동</option><option>기타</option>
        </select>
      </label>
      <label>지역
        <select id="signupArea" required>
          <option value="">선택하세요</option><option>광안리</option><option>해운대</option><option>송정</option><option>다대포</option><option>기타</option>
        </select>
      </label>
      <label>한 줄 코멘트<textarea id="signupComment" maxlength="200" placeholder="예: 주말마다 광안리에서 서핑합니다. 같이 즐겨요!"></textarea></label>
      <label>이메일<input id="signupEmail" type="email" required autocomplete="email"></label>
      <label>비밀번호<input id="signupPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="6자 이상"></label>
      <button class="btn primary full" id="signupButton">계정 만들기</button>
    </form>
  </div>

  <div id="loginPanel" class="panel">
    <form id="loginForm" class="grid">
      <label>이메일<input id="loginEmail" type="email" required autocomplete="email"></label>
      <label>비밀번호<input id="loginPassword" type="password" required autocomplete="current-password"></label>
      <button class="btn primary full" id="loginButton">로그인</button>
    </form>
  </div>
  <div id="authMessage" class="msg"></div>
</section>

<section id="appArea" class="app">
  <section id="homePage" class="page active">
    <div class="card">
      <div class="profile-head">
        <div class="avatar">🌊</div>
        <div><h2 id="homeMyName">사용자</h2><div id="homeMyInfo" class="sub"></div><span id="homeMyType" class="badge"></span></div>
      </div>
    </div>

    <div class="card">
      <div class="section-head"><h2>현재 접속 중인 사람</h2><div class="count"><span id="onlineCount">0</span>명</div></div>
      <div id="peopleList" class="people"><div class="empty">불러오는 중...</div></div>
      <p class="smallnote">프로필을 누르면 회원 정보·평점·코멘트를 확인하고 DM을 보낼 수 있습니다.</p>
    </div>

    <div class="card">
      <div class="section-head"><h2>부산 현재 날씨</h2><small id="weatherUpdated" class="sub"></small></div>
      <div id="weatherBox">
        <div class="empty">날씨 정보를 불러오는 중...</div>
      </div>
      <p class="smallnote">부산 중심 좌표 기준의 현재 기상 정보입니다.</p>
    </div>
  </section>

  <section id="dmPage" class="page">
    <div class="card">
      <div class="section-head"><h2>DM</h2><small class="sub">대화를 선택하세요</small></div>
      <div class="dm-layout">
        <div id="chatList" class="chat-list"><div class="empty">대화가 없습니다.</div></div>
        <div class="chat-box">
          <div id="chatEmpty" class="empty">온라인 사용자 프로필에서 DM을 시작해보세요.</div>
          <div id="chatActive" style="display:none">
            <div class="chat-head">
              <div><strong id="chatPartnerName">상대방</strong><div id="chatPartnerInfo" class="sub"></div></div>
              <button id="chatPartnerProfile" class="btn secondary">프로필</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" maxlength="500" placeholder="메시지를 입력하세요" autocomplete="off">
              <button class="btn primary">보내기</button>
            </form>
            <div class="meeting-actions">
              <button id="finishMeetingButton" class="btn danger full">미팅 종료하기</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="mypagePage" class="page">
    <div class="card">
      <div class="section-head"><h2>마이페이지</h2></div>
      <form id="profileForm" class="grid">
        <label>회원 분류
          <select id="profileMemberType" required><option value="취미">취미</option><option value="수강생">수강생</option><option value="강사">강사</option></select>
        </label>
        <label>이름<input id="profileName" maxlength="20" required></label>
        <label>취미
          <select id="profileHobby" required><option>서핑</option><option>낚시</option><option>수영</option><option>스노클링</option><option>패들보드</option><option>사진 촬영</option><option>해변 산책</option><option>러닝</option><option>해양 환경 활동</option><option>기타</option></select>
        </label>
        <label>지역
          <select id="profileArea" required><option>광안리</option><option>해운대</option><option>송정</option><option>다대포</option><option>기타</option></select>
        </label>
        <label>나의 코멘트<textarea id="profileComment" maxlength="200" placeholder="다른 회원에게 보여줄 소개를 입력하세요."></textarea></label>
        <button class="btn primary full" id="saveProfileButton">프로필 저장</button>
      </form>
      <div id="profileMessage" class="msg"></div>
    </div>
    <div class="card"><button id="logoutButton" class="btn danger full">로그아웃</button></div>
  </section>

  <nav class="bottom-nav">
    <button id="homeNav" class="navbtn active">🏠 홈</button>
    <button id="dmNav" class="navbtn">💬 DM</button>
    <button id="mypageNav" class="navbtn">👤 마이페이지</button>
  </nav>
</section>
</main>

<div id="profileModalBg" class="modal-bg">
  <div class="modal">
    <div class="modal-top">
      <div class="profile-head"><div class="avatar">👤</div><div><h2 id="modalName">사용자</h2><span id="modalType" class="badge"></span></div></div>
      <button id="modalClose" class="close">×</button>
    </div>
    <div class="info-list">
      <div class="info-row"><span>취미</span><strong id="modalHobby"></strong></div>
      <div class="info-row"><span>지역</span><strong id="modalArea"></strong></div>
      <div class="info-row"><span>평점</span><div class="rating"><span id="modalStars" class="stars"></span><span id="modalRatingText" class="rating-note"></span></div></div>
    </div>
    <strong>코멘트</strong>
    <div id="modalComment" class="comment-box"></div>
    <div id="modalReviews" class="review-list"></div>
    <button id="modalDmButton" class="btn primary full" style="margin-top:14px">DM 보내기</button>
  </div>
</div>

<div id="reviewModalBg" class="modal-bg">
  <div class="modal">
    <div class="modal-top">
      <div><h2 style="margin:0">미팅 리뷰</h2><div id="reviewTargetName" class="sub"></div></div>
      <button id="reviewClose" class="close">×</button>
    </div>
    <p class="smallnote">미팅이 끝났다면 상대방에 대한 경험을 남겨주세요.</p>
    <div id="reviewStars" class="review-stars">
      <button class="star-btn" data-rating="1">★</button><button class="star-btn" data-rating="2">★</button><button class="star-btn" data-rating="3">★</button><button class="star-btn" data-rating="4">★</button><button class="star-btn" data-rating="5">★</button>
    </div>
    <label>리뷰 코멘트<textarea id="reviewComment" maxlength="300" placeholder="미팅 경험을 간단히 적어주세요."></textarea></label>
    <button id="submitReviewButton" class="btn primary full" style="margin-top:12px">리뷰 등록</button>
    <div id="reviewMessage" class="msg"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getDatabase, ref, set, get, update, onValue, onDisconnect, serverTimestamp, push
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDofZhjVOK9SQDWnEeENmBB4Jc9B8t6wA",
  authDomain: "sea-mate1.firebaseapp.com",
  databaseURL: "https://sea-mate1-default-rtdb.firebaseio.com",
  projectId: "sea-mate1",
  storageBucket: "sea-mate1.firebasestorage.app",
  messagingSenderId: "898078680773",
  appId: "1:898078680773:web:a9a5a8e6d5d6063c10f2ac",
  measurementId: "G-K9EB5KT305"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

let currentProfile=null;
let selectedProfile=null;
let activeChatId=null;
let activePartner=null;
let selectedRating=0;
let unsubscribeConnected=null;
let unsubscribeStatuses=null;
let unsubscribeChats=null;
let unsubscribeMessages=null;

function msg(el,text,type=""){el.textContent=text;el.className=`msg ${type}`.trim()}
function setTab(tab){
  const s=tab==="signup";
  $("signupTab").classList.toggle("active",s);$("loginTab").classList.toggle("active",!s);
  $("signupPanel").classList.toggle("active",s);$("loginPanel").classList.toggle("active",!s);msg($("authMessage"),"");
}
$("signupTab").onclick=()=>setTab("signup");$("loginTab").onclick=()=>setTab("login");

function friendly(error){
  const m={
    "auth/email-already-in-use":"이미 가입된 이메일입니다.","auth/invalid-email":"이메일 형식을 확인하세요.",
    "auth/weak-password":"비밀번호는 6자 이상이어야 합니다.","auth/invalid-credential":"이메일 또는 비밀번호가 올바르지 않습니다.",
    "auth/network-request-failed":"인터넷 연결을 확인하세요.","PERMISSION_DENIED":"Firebase 보안 규칙을 확인하세요."
  };
  return m[error?.code]||error?.message||"오류가 발생했습니다.";
}

$("signupForm").onsubmit=async e=>{
  e.preventDefault();$("signupButton").disabled=true;msg($("authMessage"),"회원가입 중...");
  const data={memberType:$("signupMemberType").value,name:$("signupName").value.trim(),hobby:$("signupHobby").value,area:$("signupArea").value,comment:$("signupComment").value.trim(),email:$("signupEmail").value.trim()};
  try{
    const cred=await createUserWithEmailAndPassword(auth,data.email,$("signupPassword").value);
    await set(ref(db,`users/${cred.user.uid}`),{...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
    msg($("authMessage"),"회원가입 완료","ok");
  }catch(err){console.error(err);msg($("authMessage"),friendly(err),"error")}
  finally{$("signupButton").disabled=false}
};

$("loginForm").onsubmit=async e=>{
  e.preventDefault();$("loginButton").disabled=true;msg($("authMessage"),"로그인 중...");
  try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value)}
  catch(err){console.error(err);msg($("authMessage"),friendly(err),"error")}
  finally{$("loginButton").disabled=false}
};

async function loadProfile(user){
  const snap=await get(ref(db,`users/${user.uid}`));
  currentProfile=snap.exists()?snap.val():{name:user.email?.split("@")[0]||"사용자",memberType:"취미",hobby:"기타",area:"기타",comment:""};
  fillProfileUI();
}
function fillProfileUI(){
  const p=currentProfile||{};
  $("homeMyName").textContent=p.name||"사용자";$("homeMyInfo").textContent=`${p.hobby||"취미 미등록"} · ${p.area||"지역 미등록"}`;$("homeMyType").textContent=p.memberType||"미분류";
  $("profileMemberType").value=p.memberType||"취미";$("profileName").value=p.name||"";$("profileHobby").value=p.hobby||"기타";$("profileArea").value=p.area||"기타";$("profileComment").value=p.comment||"";
}

$("profileForm").onsubmit=async e=>{
  e.preventDefault();const user=auth.currentUser;if(!user)return;$("saveProfileButton").disabled=true;msg($("profileMessage"),"저장 중...");
  const patch={memberType:$("profileMemberType").value,name:$("profileName").value.trim(),hobby:$("profileHobby").value,area:$("profileArea").value,comment:$("profileComment").value.trim(),updatedAt:serverTimestamp()};
  try{await update(ref(db,`users/${user.uid}`),patch);currentProfile={...currentProfile,...patch};fillProfileUI();msg($("profileMessage"),"프로필이 저장되었습니다.","ok")}
  catch(err){msg($("profileMessage"),friendly(err),"error")}
  finally{$("saveProfileButton").disabled=false}
};

async function startPresence(user){
  const connected=ref(db,".info/connected"),statusRef=ref(db,`status/${user.uid}`);
  if(unsubscribeConnected)unsubscribeConnected();
  unsubscribeConnected=onValue(connected,async snap=>{
    if(snap.val()!==true)return;
    await onDisconnect(statusRef).set({state:"offline",lastChanged:serverTimestamp()});
    await set(statusRef,{state:"online",lastChanged:serverTimestamp()});
  });
}

function typeIcon(type){return type==="강사"?"🧑‍🏫":type==="수강생"?"🎓":"🌊"}
function chatIdFor(a,b){return [a,b].sort().join("_")}

async function getReviews(uid){
  const snap=await get(ref(db,`reviews/${uid}`));
  return snap.exists()?Object.values(snap.val()):[];
}
function ratingStats(reviews){
  if(!reviews.length)return{avg:0,count:0};
  return{avg:reviews.reduce((s,r)=>s+Number(r.rating||0),0)/reviews.length,count:reviews.length};
}
function starString(avg){if(!avg)return"☆☆☆☆☆";const n=Math.round(avg);return"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(n)}

async function openProfile(uid,p){
  selectedProfile={uid,...p};
  $("modalName").textContent=p.name||"이름 미등록";$("modalType").textContent=`${typeIcon(p.memberType)} ${p.memberType||"미분류"}`;
  $("modalHobby").textContent=p.hobby||"미등록";$("modalArea").textContent=p.area||"미등록";$("modalComment").textContent=p.comment||"아직 작성한 코멘트가 없습니다.";
  const reviews=await getReviews(uid),stats=ratingStats(reviews);
  $("modalStars").textContent=starString(stats.avg);$("modalRatingText").textContent=stats.count?`${stats.avg.toFixed(1)} / 5 · ${stats.count}개 리뷰`:"아직 리뷰 없음";
  $("modalReviews").innerHTML="";
  reviews.slice(-3).reverse().forEach(r=>{
    const el=document.createElement("div");el.className="review-card";
    el.innerHTML=`<div class="stars">${"★".repeat(Number(r.rating||0))}${"☆".repeat(5-Number(r.rating||0))}</div><div>${escapeHtml(r.comment||"코멘트 없음")}</div><small>${escapeHtml(r.reviewerName||"익명")}</small>`;
    $("modalReviews").appendChild(el);
  });
  $("modalDmButton").style.display=uid===auth.currentUser?.uid?"none":"block";
  $("profileModalBg").classList.add("show");
}
$("modalClose").onclick=()=>$("profileModalBg").classList.remove("show");
$("profileModalBg").onclick=e=>{if(e.target===$("profileModalBg"))$("profileModalBg").classList.remove("show")};

async function renderOnline(statuses,meUid){
  const entries=Object.entries(statuses||{}).filter(([,s])=>s?.state==="online");
  const rows=await Promise.all(entries.map(async([uid])=>{const snap=await get(ref(db,`users/${uid}`));return{uid,profile:snap.exists()?snap.val():{}}}));
  $("onlineCount").textContent=rows.length;$("peopleList").innerHTML="";
  if(!rows.length){$("peopleList").innerHTML='<div class="empty">현재 온라인 사용자가 없습니다.</div>';return}
  rows.forEach(({uid,profile:p})=>{
    const el=document.createElement("div");el.className="person";
    const dot=document.createElement("span");dot.className="dot";
    const info=document.createElement("div"),strong=document.createElement("strong"),small=document.createElement("small");
    strong.textContent=`${typeIcon(p.memberType)} ${p.name||"이름 미등록"}${uid===meUid?" (나)":""}`;small.textContent=`${p.hobby||"취미 미등록"} · ${p.area||"지역 미등록"}`;info.append(strong,small);
    const tag=document.createElement("span");tag.className="tag";tag.textContent=p.memberType||"미분류";el.append(dot,info,tag);el.onclick=()=>openProfile(uid,p);$("peopleList").append(el);
  });
}
function watchOnline(user){
  if(unsubscribeStatuses)unsubscribeStatuses();
  unsubscribeStatuses=onValue(ref(db,"status"),snap=>renderOnline(snap.val()||{},user.uid),()=>{$("peopleList").innerHTML='<div class="empty">접속자 목록을 읽을 수 없습니다.</div>'});
}

$("modalDmButton").onclick=async()=>{
  if(!selectedProfile||!auth.currentUser)return;
  $("profileModalBg").classList.remove("show");
  await startChat(selectedProfile.uid,selectedProfile);
};

async function startChat(otherUid,otherProfile){
  const me=auth.currentUser;if(!me||me.uid===otherUid)return;
  const chatId=chatIdFor(me.uid,otherUid),now=serverTimestamp();
  await update(ref(db),{
    [`chats/${chatId}/members/${me.uid}`]:true,
    [`chats/${chatId}/members/${otherUid}`]:true,
    [`chats/${chatId}/updatedAt`]:now,
    [`userChats/${me.uid}/${chatId}/otherUid`]:otherUid,
    [`userChats/${me.uid}/${chatId}/updatedAt`]:now,
    [`userChats/${otherUid}/${chatId}/otherUid`]:me.uid,
    [`userChats/${otherUid}/${chatId}/updatedAt`]:now
  });
  showPage("dm");await openChat(chatId,otherUid,otherProfile);
}

async function watchChatList(user){
  if(unsubscribeChats)unsubscribeChats();
  unsubscribeChats=onValue(ref(db,`userChats/${user.uid}`),async snap=>{
    const chats=snap.val()||{},items=Object.entries(chats);
    $("chatList").innerHTML="";
    if(!items.length){$("chatList").innerHTML='<div class="empty">대화가 없습니다.</div>';return}
    const rows=await Promise.all(items.map(async([chatId,v])=>{const ps=await get(ref(db,`users/${v.otherUid}`));return{chatId,otherUid:v.otherUid,updatedAt:v.updatedAt||0,profile:ps.exists()?ps.val():{name:"사용자"}}}));
    rows.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    rows.forEach(r=>{
      const b=document.createElement("button");b.className="chat-item"+(r.chatId===activeChatId?" active":"");b.innerHTML=`<strong>${escapeHtml(r.profile.name||"사용자")}</strong><small>${escapeHtml(r.profile.memberType||"미분류")} · ${escapeHtml(r.profile.hobby||"")}</small>`;
      b.onclick=()=>openChat(r.chatId,r.otherUid,r.profile);$("chatList").appendChild(b);
    });
  });
}

async function openChat(chatId,otherUid,otherProfile){
  activeChatId=chatId;activePartner={uid:otherUid,...otherProfile};$("chatEmpty").style.display="none";$("chatActive").style.display="block";
  $("chatPartnerName").textContent=otherProfile.name||"사용자";$("chatPartnerInfo").textContent=`${otherProfile.memberType||"미분류"} · ${otherProfile.hobby||""} · ${otherProfile.area||""}`;
  if(unsubscribeMessages)unsubscribeMessages();
  unsubscribeMessages=onValue(ref(db,`chats/${chatId}/messages`),snap=>{
    const data=snap.val()||{},rows=Object.values(data).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));$("chatMessages").innerHTML="";
    rows.forEach(m=>{
      const el=document.createElement("div");el.className="bubble "+(m.senderUid===auth.currentUser.uid?"mine":"theirs");
      el.innerHTML=`${escapeHtml(m.text||"")}<span class="bubble-time">${formatTime(m.createdAt)}</span>`;$("chatMessages").appendChild(el);
    });
    $("chatMessages").scrollTop=$("chatMessages").scrollHeight;
  });
  watchChatList(auth.currentUser);
}
$("chatPartnerProfile").onclick=()=>{if(activePartner)openProfile(activePartner.uid,activePartner)};

$("chatForm").onsubmit=async e=>{
  e.preventDefault();const text=$("chatInput").value.trim();if(!text||!activeChatId||!activePartner)return;
  const messageRef=push(ref(db,`chats/${activeChatId}/messages`));const now=serverTimestamp();
  await set(messageRef,{senderUid:auth.currentUser.uid,text,createdAt:now});
  await update(ref(db),{
    [`chats/${activeChatId}/updatedAt`]:now,
    [`userChats/${auth.currentUser.uid}/${activeChatId}/updatedAt`]:now,
    [`userChats/${activePartner.uid}/${activeChatId}/updatedAt`]:now
  });
  $("chatInput").value="";
};

$("finishMeetingButton").onclick=()=>{
  if(!activePartner)return;selectedRating=0;paintReviewStars();$("reviewComment").value="";msg($("reviewMessage"),"");
  $("reviewTargetName").textContent=`${activePartner.name||"상대방"}님과의 미팅`;$("reviewModalBg").classList.add("show");
};
$("reviewClose").onclick=()=>$("reviewModalBg").classList.remove("show");
$("reviewModalBg").onclick=e=>{if(e.target===$("reviewModalBg"))$("reviewModalBg").classList.remove("show")};
document.querySelectorAll(".star-btn").forEach(b=>b.onclick=()=>{selectedRating=Number(b.dataset.rating);paintReviewStars()});
function paintReviewStars(){document.querySelectorAll(".star-btn").forEach(b=>b.classList.toggle("active",Number(b.dataset.rating)<=selectedRating))}

$("submitReviewButton").onclick=async()=>{
  if(!activePartner||!activeChatId||!selectedRating){msg($("reviewMessage"),"별점을 선택해주세요.","error");return}
  const existing=await getReviews(activePartner.uid);
  const duplicate=existing.some(r=>r.reviewerUid===auth.currentUser.uid&&r.chatId===activeChatId);
  if(duplicate){msg($("reviewMessage"),"이 대화에 대한 리뷰를 이미 작성했습니다.","error");return}
  const rref=push(ref(db,`reviews/${activePartner.uid}`));
  await set(rref,{reviewerUid:auth.currentUser.uid,reviewerName:currentProfile?.name||"사용자",rating:selectedRating,comment:$("reviewComment").value.trim(),chatId:activeChatId,createdAt:serverTimestamp()});
  msg($("reviewMessage"),"리뷰가 등록되었습니다.","ok");
  setTimeout(()=>{$("reviewModalBg").classList.remove("show")},600);
};

async function loadWeather(){
  const box=$("weatherBox");
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude=35.1796&longitude=129.0756&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&timezone=Asia%2FSeoul";
    const res=await fetch(url);if(!res.ok)throw new Error("weather");
    const data=await res.json(),w=data.current,info=weatherCode(w.weather_code);
    $("weatherUpdated").textContent=`${w.time?.replace("T"," ")} 기준`;
    box.innerHTML=`<div class="weather-main"><div class="weather-icon">${info.icon}</div><div><div class="weather-temp">${Math.round(w.temperature_2m)}°C</div><div class="weather-desc">${info.text}</div></div></div>
      <div class="weather-grid">
        <div class="weather-item"><span>체감</span><b>${Math.round(w.apparent_temperature)}°C</b></div>
        <div class="weather-item"><span>습도</span><b>${w.relative_humidity_2m}%</b></div>
        <div class="weather-item"><span>풍속</span><b>${Math.round(w.wind_speed_10m)} km/h</b></div>
        <div class="weather-item"><span>강수</span><b>${w.precipitation} mm</b></div>
      </div>`;
  }catch(e){box.innerHTML='<div class="empty">날씨 정보를 불러오지 못했습니다.</div>'}
}
function weatherCode(c){
  if(c===0)return{icon:"☀️",text:"맑음"};if([1,2].includes(c))return{icon:"🌤️",text:"대체로 맑음"};if(c===3)return{icon:"☁️",text:"흐림"};
  if([45,48].includes(c))return{icon:"🌫️",text:"안개"};if([51,53,55,56,57].includes(c))return{icon:"🌦️",text:"이슬비"};
  if([61,63,65,66,67,80,81,82].includes(c))return{icon:"🌧️",text:"비"};if([71,73,75,77,85,86].includes(c))return{icon:"🌨️",text:"눈"};
  if([95,96,99].includes(c))return{icon:"⛈️",text:"뇌우"};return{icon:"🌊",text:"기상 정보"};
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function formatTime(ts){if(!ts||typeof ts!=="number")return"";return new Date(ts).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}

function showPage(page){
  const pages=["home","dm","mypage"];pages.forEach(p=>{$(`${p}Page`).classList.toggle("active",p===page);$(`${p}Nav`).classList.toggle("active",p===page)});
}
$("homeNav").onclick=()=>showPage("home");$("dmNav").onclick=()=>showPage("dm");$("mypageNav").onclick=()=>showPage("mypage");

$("logoutButton").onclick=async()=>{
  const user=auth.currentUser;
  try{if(user)await set(ref(db,`status/${user.uid}`),{state:"offline",lastChanged:serverTimestamp()});await signOut(auth)}
  catch(err){alert(friendly(err))}
};

onAuthStateChanged(auth,async user=>{
  if(user){
    $("authCard").style.display="none";$("appArea").style.display="block";
    try{await loadProfile(user)}catch(err){console.error(err)}
    startPresence(user);watchOnline(user);watchChatList(user);loadWeather();showPage("home");
  }else{
    [unsubscribeConnected,unsubscribeStatuses,unsubscribeChats,unsubscribeMessages].forEach(fn=>{if(fn)fn()});
    unsubscribeConnected=unsubscribeStatuses=unsubscribeChats=unsubscribeMessages=null;
    $("authCard").style.display="block";$("appArea").style.display="none";setTab("login");
  }
});
</script>
</body>
</html>
